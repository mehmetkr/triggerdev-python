[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triggerdev"
version = "0.0.0"
description = "The first fully typed async Python SDK for the Trigger.dev management API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mehmet Karaoglu" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/mehmetkr/triggerdev-python"
Repository = "https://github.com/mehmetkr/triggerdev-python"
Issues = "https://github.com/mehmetkr/triggerdev-python/issues"
Changelog = "https://github.com/mehmetkr/triggerdev-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pyright>=1.1.380",
    "ruff>=0.7",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/triggerdev"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"src/triggerdev/types/**/*.py" = ["TCH"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
