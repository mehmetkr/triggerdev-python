name: Bug report
description: Report an issue with the triggerdev Python library
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: This is an issue with the triggerdev Python library, not the Trigger.dev API or platform.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code snippet
      description: If applicable, a minimal code example that reproduces the issue.
      render: python
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include the full traceback if applicable.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g., Ubuntu 24.04, macOS 15, Windows 11
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g., 3.12.0
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      placeholder: e.g., 0.1.0
    validations:
      required: true
